<!DOCTYPE html>
<html lang="en">
<head>
	<meta charset="utf-8" />
	<title>Claude AI API Integration | COMP1073 Client-Side JavaScript</title>
	<meta name="viewport" content="width=device-width, initial-scale=1.0" />
	<link href="normalize.css" rel="stylesheet" />
	<link href="styles.css" rel="stylesheet" />
	<script src="claude-api.js" defer></script>
</head>

<body>
	<h1>Claude AI API Integration</h1>
	
	<form>
		<label for="user-message">Your Message:</label>
		<textarea id="user-message" placeholder="Type your message to Claude..." rows="4"></textarea>
		<button type="button" id="send-message">Send Message</button>
		<button type="button" id="check-usage">Check Usage</button>
	</form>
	
	<section id="results"></section>

	<section id="follow-up-section" hidden>
		<label for="follow-up-message">Follow-up Message:</label>
		<textarea id="follow-up-message" placeholder="Type your follow-up message..." rows="4"></textarea>
		<button type="button" id="send-follow-up">Send Follow-up</button>
	</section>
</body>
</html>
